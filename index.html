<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KK Okuyucu">
<meta name="theme-color" content="#14171a">
<title>KK Okuyucu</title>
<style>
/* Tek ekran depo aracı: üstte kamera, ortada durum bandı, altta liste ve gönder çubuğu */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#16201c; --muted:#5d6b65; --line:#d9e0dd;
  --accent:#1f7a55; --accent-fg:#ffffff;
  --ok:#1f7a55; --ok-bg:#dff1e8; --dup:#b3261e; --dup-bg:#fbe3e1;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101413; --panel:#1a201e; --fg:#e6ece9; --muted:#93a39c; --line:#2b3431;
  --accent:#3fb37f; --accent-fg:#06140d;
  --ok:#5fd39c; --ok-bg:#163327; --dup:#ff8a80; --dup-bg:#3d1714; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.count b{color:var(--fg);font-size:17px}
#camWrap{position:relative;margin:0 16px;border-radius:14px;overflow:hidden;background:#000;
  aspect-ratio:4/3;max-height:38vh;max-width:100%}
#reader{width:100%;height:100%;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;transform-origin:center;display:block}
#aim{position:absolute;left:50%;top:50%;width:var(--aim,62%);aspect-ratio:1;max-height:86%;transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#zoom button{padding:6px 10px;font-size:13px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35)}
#zoom button.on{background:#fff;color:#000}
#camIdle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#cfd8d4;text-align:center;padding:16px}
#camIdle p{margin:0;font-size:13px;max-width:30ch}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
#flash.ok{background:rgba(63,179,127,.45);opacity:1;transition:none}
#flash.dup{background:rgba(220,40,30,.55);opacity:1;transition:none}
#status{margin:10px 16px 0;border-radius:12px;padding:10px 12px;min-height:58px;
  background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
#status .t{font-weight:700;font-size:15px}
#status .c{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all;margin-top:2px}
#status.ok{background:var(--ok-bg);border-color:transparent}
#status.ok .t{color:var(--ok)}
#status.dup{background:var(--dup-bg);border-color:var(--dup)}
#status.dup .t{color:var(--dup);font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 16px 0;font-size:13px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px}
.manual{display:flex;gap:8px;margin:8px 16px 0}
.manual input{flex:1;min-width:0;font:14px var(--mono);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
#list{flex:1;overflow-y:auto;margin:10px 0 0;padding:0 16px;list-style:none}
#list li{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
#list .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
#list .v{font-family:var(--mono);font-size:13px;word-break:break-all;min-width:0}
#list .v small{display:block;font-family:var(--font);color:var(--muted);font-size:11.5px}
#list li.hit{animation:hit 1.6s}
@keyframes hit{0%{background:var(--dup-bg)}100%{background:transparent}}
#list .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
footer{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-top:1px solid var(--line)}
button{font:600 15px var(--font);border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;flex:1}
button.danger{color:var(--dup)}
button:disabled{opacity:.45}
#confirm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#confirm .box{background:var(--panel);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#confirm p{margin:0 0 6px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>KK Okuyucu</h1>
  <div class="count"><b id="cnt">0</b> kod · <span id="dupCnt">0</span> mükerrer</div>
</header>

<div id="camWrap">
  <div id="reader"><video id="video" playsinline muted autoplay></video></div>
  <div id="aim" hidden></div>
  <div id="zoom" hidden>
    <button type="button" data-z="1" class="on">1x</button>
    <button type="button" data-z="2">2x</button>
    <button type="button" data-z="3">3x</button>
  </div>
  <div id="camIdle">
    <button class="primary" id="startBtn" style="flex:none;padding:12px 22px">Kamerayı Aç</button>
    <p>Barkod, QR ve Data Matrix okur. Aynı kod ikinci kez okunursa kırmızı uyarı ve sesli ikaz verir.</p>
  </div>
  <div id="flash"></div>
</div>

<div id="status"><div class="t">Hazır</div><div class="c">Kamerayı açıp etiketi çerçeveye getirin.</div></div>

<div class="opts">
  <label><input type="checkbox" id="optSkip" checked> Mükerreri listeye ekleme</label>
  <label><input type="checkbox" id="optSound" checked> Ses</label>
</div>

<form class="manual" id="manualForm" autocomplete="off">
  <input id="manualIn" placeholder="Okunmayan kodu elle yazın" enterkeyhint="done">
  <button type="submit">Ekle</button>
</form>

<ul id="list"></ul>

<footer>
  <button class="danger" id="clearBtn">Temizle</button>
  <button id="copyBtn">Kopyala</button>
  <button class="primary" id="shareBtn">WhatsApp'a Gönder</button>
</footer>

<div id="confirm" hidden>
  <div class="box">
    <p id="confirmText">Liste silinsin mi?</p>
    <button class="primary" id="confirmYes" style="background:var(--dup)">Evet, sil</button>
    <button id="confirmNo">Vazgeç</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>
<script>
(function(){
  var KEY = "kk-okuyucu-liste";
  var items = [];           // {code, time}
  var dupCount = 0;
  var last = {code:null, at:0};
  var scanner = null, audio = null;
  var $ = function(id){return document.getElementById(id)};

  // GS1 Data Matrix'teki görünmez ayraçları (FNC1/GS) ve boşlukları temizle
  function clean(s){ return String(s).replace(/[\x00-\x1f\x7f]/g,"").trim(); }

  function load(){
    try{ var d = JSON.parse(localStorage.getItem(KEY)||"{}"); items = d.items||[]; dupCount = d.dup||0; }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({items:items, dup:dupCount})); }catch(e){}
  }
  function hhmm(t){ var d=new Date(t); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2); }

  function render(hitIndex){
    var ul = $("list"); ul.innerHTML = "";
    if(!items.length){ ul.innerHTML = '<li class="empty" style="display:block;border:0">Henüz kod okunmadı.</li>'; }
    for(var i=items.length-1;i>=0;i--){
      var li = document.createElement("li");
      if(i===hitIndex) li.className="hit";
      var n=document.createElement("span"); n.className="n"; n.textContent=(i+1)+".";
      var v=document.createElement("span"); v.className="v"; v.textContent=items[i].code;
      var s=document.createElement("small"); s.textContent=hhmm(items[i].time)+(items[i].dup?" · mükerrer":""); v.appendChild(s);
      var x=document.createElement("button"); x.className="x"; x.setAttribute("aria-label","Sil"); x.textContent="×";
      x.dataset.i=i;
      li.appendChild(n); li.appendChild(v); li.appendChild(x); ul.appendChild(li);
    }
    $("cnt").textContent = items.length;
    $("dupCnt").textContent = dupCount;
    $("shareBtn").disabled = $("copyBtn").disabled = !items.length;
  }

  function beep(kind){
    if(!$("optSound").checked) return;
    try{
      audio = audio || new (window.AudioContext||window.webkitAudioContext)();
      var tones = kind==="dup" ? [[220,.18],[0,.06],[220,.18],[0,.06],[220,.25]] : [[1400,.09]];
      var t = audio.currentTime;
      tones.forEach(function(tn){
        if(tn[0]){
          var o=audio.createOscillator(), g=audio.createGain();
          o.type = kind==="dup" ? "square" : "sine"; o.frequency.value=tn[0];
          g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+tn[1]);
          o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+tn[1]);
        }
        t += tn[1];
      });
    }catch(e){}
    if(navigator.vibrate) try{ navigator.vibrate(kind==="dup"?[200,80,200]:40); }catch(e){}
  }

  function flash(kind){
    var f=$("flash"); f.className=kind;
    setTimeout(function(){ f.className=""; }, kind==="dup"?600:150);
  }

  function setStatus(kind, title, code){
    var s=$("status"); s.className=kind||"";
    s.innerHTML=""; var t=document.createElement("div"); t.className="t"; t.textContent=title;
    var c=document.createElement("div"); c.className="c"; c.textContent=code||"";
    s.appendChild(t); s.appendChild(c);
  }

  function add(raw, manual){
    var code = clean(raw); if(!code) return;
    var now = Date.now();
    // Kod çerçevede durmaya devam ederse aynı okumayı tekrar sayma
    if(!manual && code===last.code && now-last.at<3000){ last.at=now; return; }
    last = {code:code, at:now};

    var idx = -1;
    for(var i=0;i<items.length;i++){ if(items[i].code===code){ idx=i; break; } }

    if(idx>=0){
      dupCount++;
      beep("dup"); flash("dup");
      setStatus("dup","MÜKERRER! "+(idx+1)+". sıradaki kodla aynı ("+hhmm(items[idx].time)+")", code);
      if(!$("optSkip").checked){ items.push({code:code,time:now,dup:true}); }
      save(); render(idx);
    }else{
      items.push({code:code,time:now});
      beep("ok"); flash("ok");
      setStatus("ok", items.length+". kod eklendi", code);
      save(); render();
    }
  }

  function textOut(){ return items.map(function(x){return x.code}).join("\n"); }

  function toast(msg){ var t=$("toast"); t.textContent=msg; t.className="on"; setTimeout(function(){t.className=""},1800); }

  function copy(){
    var txt=textOut();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast(items.length+" kod kopyalandı")},function(){fallbackCopy(txt)});
    }else fallbackCopy(txt);
  }
  function fallbackCopy(txt){
    var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(items.length+" kod kopyalandı"); }catch(e){ toast("Kopyalanamadı"); }
    ta.remove();
  }

  function share(){
    var txt=textOut();
    if(navigator.share){
      navigator.share({text:txt}).catch(function(e){ if(e && e.name!=="AbortError") openWa(txt); });
    }else openWa(txt);
  }
  function openWa(txt){ location.href="https://wa.me/?text="+encodeURIComponent(txt); }

  // ---- Tarama motoru: yüksek çözünürlüklü kamera + zxing-cpp (WebAssembly) ----
  var FORMATS = ["DataMatrix","QRCode","EAN13","EAN8","Code128","Code39","UPCA","UPCE","ITF","Code93","Codabar"];
  var stream=null, track=null, running=false, busy=false, zoom=1, hwZoom=false, timer=null;
  var canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true});
  var video=$("video");

  function lib(){ return window.ZXingWASM; }

  function openCamera(){
    return navigator.mediaDevices.getUserMedia({audio:false, video:{
      facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}
    }}).then(function(s){
      stream=s; track=s.getVideoTracks()[0];
      video.srcObject=s;
      return video.play();
    }).then(function(){
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      var adv = [];
      if(caps.focusMode && caps.focusMode.indexOf("continuous")>=0) adv.push({focusMode:"continuous"});
      if(adv.length) track.applyConstraints({advanced:adv}).catch(function(){});
      hwZoom = !!(caps.zoom && caps.zoom.max>=2);
      $("zoom").hidden=false; $("aim").hidden=false;
      setZoom(zoom);
    });
  }

  function setZoom(z){
    zoom=z;
    [].forEach.call($("zoom").querySelectorAll("button"),function(b){ b.className = (+b.dataset.z===z)?"on":""; });
    if(hwZoom){
      var caps=track.getCapabilities();
      track.applyConstraints({advanced:[{zoom:Math.min(z,caps.zoom.max)}]}).catch(function(){});
      video.style.transform="";
    }else{
      // donanım zoom'u yoksa görüntüyü büyüt, okumayı da merkezden kırp
      video.style.transform = z>1 ? "scale("+z+")" : "";
    }
  }

  function scanFrame(){
    if(!running) return;
    if(busy || !video.videoWidth || !lib()){ timer=setTimeout(scanFrame,120); return; }
    busy=true;
    var vw=video.videoWidth, vh=video.videoHeight;
    var side=Math.min(vw,vh) * 0.75 / (hwZoom?1:zoom);
    var sx=(vw-side)/2, sy=(vh-side)/2;
    var out=Math.min(1000, Math.round(side));
    canvas.width=out; canvas.height=out;
    ctx.drawImage(video, sx, sy, side, side, 0, 0, out, out);
    var img=ctx.getImageData(0,0,out,out);
    lib().readBarcodes(img, {formats:FORMATS, tryHarder:true, tryRotate:true, tryInvert:true, textMode:"Plain", maxNumberOfSymbols:1})
      .then(function(res){
        for(var i=0;i<res.length;i++){ if(res[i].isValid && res[i].text){ add(res[i].text,false); break; } }
      })
      .catch(function(){})
      .then(function(){ busy=false; timer=setTimeout(scanFrame,80); });
  }

  function start(){
    // ses iOS'ta ancak dokunuşla açılır; ilk dokunuşta hazırla
    try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume && audio.resume(); }catch(e){}
    if(!lib()){ setStatus("dup","Okuyucu yüklenemedi","İnternet bağlantısını kontrol edip sayfayı yenileyin."); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setStatus("dup","Kamera desteklenmiyor","Sayfayı Safari'de ve https:// adresiyle açın."); return; }
    setStatus("","Kamera açılıyor…","");
    openCamera().then(function(){
      $("camIdle").hidden=true; scanner=true; running=true;
      setStatus("","Okumaya hazır","Kodu kare çerçevenin içine getirin. Küçük etikette 2x deneyin.");
      scanFrame();
    }).catch(function(err){
      setStatus("dup","Kamera açılamadı","Safari ayarlarından bu siteye kamera izni verin. ("+(err&&err.name||err)+")");
    });
  }

  function stopCamera(){
    running=false; clearTimeout(timer);
    if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
  }

  $("zoom").onclick=function(e){ var b=e.target.closest("button"); if(b) setZoom(+b.dataset.z); };

  // kütüphaneyi önceden ısıt (wasm dosyası ilk kullanımda iner)
  setTimeout(function(){ try{ lib() && lib().readBarcodes(new ImageData(8,8),{formats:["QRCode"]}).catch(function(){}); }catch(e){} }, 300);

  var pending=null;
  function ask(text, fn){ $("confirmText").textContent=text; pending=fn; $("confirm").hidden=false; }
  $("confirmYes").onclick=function(){ $("confirm").hidden=true; if(pending) pending(); pending=null; };
  $("confirmNo").onclick=function(){ $("confirm").hidden=true; pending=null; };

  $("startBtn").onclick=start;
  $("shareBtn").onclick=share;
  $("copyBtn").onclick=copy;
  $("clearBtn").onclick=function(){
    if(!items.length) return;
    ask(items.length+" kodluk liste silinsin mi?", function(){ items=[]; dupCount=0; last={code:null,at:0}; save(); render(); setStatus("","Liste temizlendi",""); });
  };
  $("list").onclick=function(e){
    var b=e.target.closest(".x"); if(!b) return;
    var i=+b.dataset.i;
    ask((i+1)+". kod silinsin mi?\n"+items[i].code, function(){ items.splice(i,1); save(); render(); });
  };
  $("manualForm").onsubmit=function(e){ e.preventDefault(); var v=$("manualIn").value; $("manualIn").value=""; add(v,true); };
  document.addEventListener("visibilitychange",function(){
    if(!scanner) return;
    if(document.hidden){ stopCamera(); }
    else{ openCamera().then(function(){ running=true; scanFrame(); }).catch(function(){ $("camIdle").hidden=false; }); }
  });

  load(); render();
})();
</script>
</body>
</html>
